name: Validar Movement
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: movement
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: Movement_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U movement -d Movement_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MOVEMENT_TEST_DATABASE_URL: postgresql+psycopg://movement:ci-only-password@127.0.0.1:5432/Movement_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - run: ruff check backend
      - run: pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python hardware/logica/verificar_logica.py
      - run: python hardware/logica/testar_firmware.py
  image:
    needs: [backend, frontend, firmware]
    runs-on: ubuntu-latest
    env:
      # main publica movement:latest (produção) e Devlop publica movement:devlop (teste); as demais só constroem.
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Devlop') && vars.ACR_LOGIN_SERVER != '' }}
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
      IMAGE: ${{ vars.ACR_LOGIN_SERVER || 'local' }}/movement
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.CHANNEL }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy movement-dev
    timeout-minutes: 10
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/Devlop'
    runs-on: ubuntu-latest
    environment: movement-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container to Azure App Service
        timeout-minutes: 3
        env:
          DEPLOY_IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/movement:${{ github.sha }}
        run: |
          az webapp config container set --resource-group movement_group --name movement-dev --container-image-name "$DEPLOY_IMAGE" --output none
          az webapp restart --resource-group movement_group --name movement-dev --output none
      - name: Verify movement-dev readiness
        timeout-minutes: 5
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 https://movement-dev-dqdbhsctd8gwb5fn.westus3-01.azurewebsites.net/api/ready; then
              exit 0
            fi
            sleep 10
          done
          echo "movement-dev nao ficou pronto; confira os logs do conteiner no Azure."
          exit 1
