name: Validar Movement
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: movement
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: Movement_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U movement -d Movement_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MOVEMENT_TEST_DATABASE_URL: postgresql+psycopg://movement:ci-only-password@127.0.0.1:5432/Movement_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - run: ruff check backend
      - run: pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Só a main publica no Azure Container Registry; nas demais branches a imagem é apenas construída.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ACR_LOGIN_SERVER != '' }}
      IMAGE: ${{ vars.ACR_LOGIN_SERVER || 'local' }}/movement
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
