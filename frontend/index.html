<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1a2b" />
    <script>
      try {
        if (localStorage.getItem("movement:theme") === "light")
          document.documentElement.dataset.theme = "light";
      } catch {
        // Sem armazenamento disponível, mantém o tema escuro padrão.
      }
    </script>
    <meta
      name="description"
      content="Gestão de salas e aparelhos de ar-condicionado, monitoramento de sensores e histórico mensal com React, FastAPI e PostgreSQL."
    />
    <meta
      property="og:title"
      content="Movement: climatização automática de salas de aula"
    />
    <meta
      property="og:description"
      content="Painel que mede temperatura, umidade e ocupação das salas e comanda o ar-condicionado para economizar energia."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Movement — Gestão de Climatização</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
